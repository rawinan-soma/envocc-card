# Prometheus scrapes nothing: the Collector pushes metrics to its OTLP endpoint
# (--web.enable-otlp-receiver). Retention (90 days) and its size cap are flags
# in compose.yml.
global: {}

otlp:
  # service.name and service.instance.id become job and instance; these too
  # are worth filtering by.
  promote_resource_attributes:
    - service.namespace
    - deployment.environment.name

storage:
  tsdb:
    # The Collector batches, so points may arrive a little late.
    out_of_order_time_window: 10m
