# Loki, single binary, chunks and index on local disk, OTLP in.
#
# Retention: 90 days, enforced by the compactor. Size cap: Loki has no on-disk
# size limit, so ingestion is rate-limited instead, which bounds what 90 days
# can hold: at most 5 kB/s × 90 d ≈ 39 GB of log lines before compression,
# under 10 GB on disk. Raise both together if the pilot outgrows them.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 2160h
  ingestion_rate_mb: 0.005
  ingestion_burst_size_mb: 1
  # Trace context arrives as structured metadata (trace_id, span_id).
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
